# An example, not part of kustomization.yaml: applying it again would replace
# the real key with the placeholder, and the exporter reloads the key, so
# every scrape would then fail with a 401. Create the Secret once instead:
#   kubectl -n typesense create secret generic typesense-api-key --from-file=api-key=./api-key
# or edit the value below and apply this file once:
#   kubectl apply -f secret.example.yaml
apiVersion: v1
kind: Secret
metadata:
  name: typesense-api-key
  namespace: typesense
type: Opaque
stringData:
  api-key: CHANGE-ME
