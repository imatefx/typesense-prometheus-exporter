apiVersion: v1
kind: ConfigMap
metadata:
  name: typesense-exporter
  labels:
    app.kubernetes.io/name: typesense-exporter
data:
  exporter.toml: |
    typesense_timeout = 5

    # The nodes of one Typesense cluster. Prometheus passes these as ?target=,
    # matched on host and port: a target without a port matches an entry with
    # the default port (8108), but any other spelling of the host does not.
    # List them in the Probe resource the same way.
    # For a StatefulSet "typesense" behind a headless Service "typesense" in
    # the namespace "typesense":
    [clusters.prod]
    targets = [
      "typesense-0.typesense.typesense.svc:8108",
      "typesense-1.typesense.typesense.svc:8108",
      "typesense-2.typesense.typesense.svc:8108",
    ]
    api_key_file = "/run/secrets/typesense/api-key"
    protocol = "http"

    # Instead of a cluster, a single key for a list of nodes works too:
    #   probe_allowed_targets = ["typesense-0.typesense.typesense.svc:8108"]
    #   typesense_api_key_file = "/run/secrets/typesense/api-key"
