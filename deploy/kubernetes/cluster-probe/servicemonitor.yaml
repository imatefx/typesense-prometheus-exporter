# Needs the Prometheus Operator CRDs. Your Prometheus may only select
# ServiceMonitors with a label such as `release: <helm release>`; add it here.
#
# The exporter's own health: probe refusals, Typesense request failures, key
# reload failures. probe.yaml scrapes the nodes through /probe; this scrapes the
# exporter itself, as the job the exporter alerts in alerts.yml expect.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: typesense-exporter-self
  labels:
    app.kubernetes.io/name: typesense-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: typesense-exporter
  endpoints:
    - port: http
      path: /exporter/metrics
      interval: 30s
      relabelings:
        - action: replace
          targetLabel: job
          replacement: typesense-exporter-self
