# Needs the Prometheus Operator CRDs. Your Prometheus may only select Probes
# with a label such as `release: <helm release>`; add it here.
#
# The operator scrapes the prober for every static target and passes the
# target as ?target=<node>; `instance` is the node, not the exporter.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: typesense
  labels:
    app.kubernetes.io/name: typesense-exporter
spec:
  jobName: typesense
  interval: 30s
  scrapeTimeout: 10s   # above typesense_timeout (5s)
  prober:
    # host:port without a scheme. Prometheus resolves this from its own
    # namespace, so use the full name: <service>.<namespace>.svc
    url: typesense-exporter.typesense.svc:8888
    path: /probe
  targets:
    staticConfig:
      # Written exactly as in the cluster's targets in exporter.toml.
      static:
        - typesense-0.typesense.typesense.svc:8108
        - typesense-1.typesense.typesense.svc:8108
        - typesense-2.typesense.typesense.svc:8108
      labels:
        cluster: prod
