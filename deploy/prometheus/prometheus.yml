global:
  scrape_interval: 5s
  # Must stay above the exporter's TYPESENSE_TIMEOUT (2s in docker-compose.yml),
  # or a hung Typesense node fails the whole scrape instead of reporting it
  # unhealthy.
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  # One exporter probes every node (multi-target pattern, like
  # blackbox_exporter): each target is a separate scrape of
  # exporter:8888/probe?target=<node>, so a hung node only times out its own
  # scrape and `up` is per node.
  - job_name: typesense-exporter
    metrics_path: /probe
    static_configs:
      - targets: ["typesense-1:8108", "typesense-2:8108", "typesense-3:8108"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: exporter:8888

  # The exporter's own health (scrapes, Typesense request outcomes, key
  # reloads). Not a Typesense node, so no /probe and no host or port labels.
  - job_name: typesense-exporter-self
    metrics_path: /exporter/metrics
    static_configs:
      - targets: ["exporter:8888"]
