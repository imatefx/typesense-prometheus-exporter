global:
  scrape_interval: 5s
  # Must stay above the exporter's TYPESENSE_TIMEOUT (2s in docker-compose.yml),
  # or a hung Typesense node fails the whole scrape instead of reporting it
  # unhealthy.
  scrape_timeout: 4s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: typesense-exporter
    static_configs:
      - targets: ["exporter-1:8888", "exporter-2:8888", "exporter-3:8888"]
