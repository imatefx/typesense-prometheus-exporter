name: Rust Multi-Architecture Build

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [ main, master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build for ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: typesense-prometheus-exporter
            asset_name: typesense-prometheus-exporter-linux-amd64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm   # native ARM runner; no cross toolchain needed
            artifact_name: typesense-prometheus-exporter
            asset_name: typesense-prometheus-exporter-linux-arm64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: typesense-prometheus-exporter
            asset_name: typesense-prometheus-exporter-macos-amd64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact_name: typesense-prometheus-exporter
            asset_name: typesense-prometheus-exporter-macos-arm64
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            artifact_name: typesense-prometheus-exporter.exe
            asset_name: typesense-prometheus-exporter-windows-amd64.exe

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: stable
        targets: ${{ matrix.target }}
    
    - name: Install Windows cross-compilation toolchain
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-mingw-w64-x86-64

    - name: Configure Windows cross-compilation
      if: matrix.target == 'x86_64-pc-windows-gnu'
      run: |
        echo '[target.x86_64-pc-windows-gnu]' >> ~/.cargo/config.toml
        echo 'linker = "x86_64-w64-mingw32-gcc"' >> ~/.cargo/config.toml
        
    - name: Build
      run: cargo build --release --target ${{ matrix.target }} --verbose
      
    - name: Rename artifact
      run: |
        mkdir -p artifacts
        cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} artifacts/${{ matrix.asset_name }}
        
    - name: Upload artifact
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: ${{ matrix.asset_name }}
        path: artifacts/${{ matrix.asset_name }}
        
  # Never publish a release from a commit whose tests fail.
  test:
    name: Tests before release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
      with:
        toolchain: stable
    - run: cargo test --locked

  release:
    needs: [build, test]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write   # create the GitHub release and upload assets
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Download all artifacts
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: artifacts

    - name: Prepare release assets
      run: |
        mkdir -p release-assets
        find artifacts -type f -exec cp {} release-assets/ \;
        cd release-assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS

    - name: Release notes from CHANGELOG.md
      run: |
        version="${GITHUB_REF_NAME#v}"
        {
          echo "**Docker:** \`docker pull imatefx/typesense-prometheus-exporter:${GITHUB_REF_NAME}\` (linux/amd64, linux/arm64)"
          echo
          awk -v v="$version" 'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md
        } > release-notes.md
        grep -q '^### ' release-notes.md || { echo "No CHANGELOG.md section for $version"; exit 1; }
        cat release-notes.md

    - name: Create Release
      uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
      with:
        artifacts: "release-assets/*"
        bodyFile: release-notes.md
        makeLatest: true
