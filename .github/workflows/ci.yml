name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: unit + integration tests, coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the coverage badge to the badges branch
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Test with coverage
        run: cargo llvm-cov --lcov --output-path lcov.info --fail-under-lines 90
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
      - name: Publish coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          pct=$(cargo llvm-cov report --json --summary-only | jq '.data[0].totals.lines.percent | floor')
          if ((pct >= 90)); then color=brightgreen; elif ((pct >= 75)); then color=yellow; else color=red; fi
          mkdir -p badge && cd badge
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          git init -q -b badges
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add coverage.json
          git commit -q -m "coverage: ${pct}%"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: end-to-end (3-node cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - name: Run e2e tests
        run: cargo nextest run --features e2e --test e2e --profile ci
      - name: Exporter logs
        if: failure()
        run: docker compose logs --tail 50 exporter-1 exporter-2 exporter-3
      - name: Tear down
        if: always()
        run: docker compose down -v
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-junit
          path: target/nextest/ci/junit.xml
