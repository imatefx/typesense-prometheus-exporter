# Local monitoring stack: a 3-node Typesense cluster, one exporter probing every node,
# Prometheus (with alert rules) and Grafana (with the dashboards provisioned).
#   docker compose up -d --build
# Grafana: http://localhost:3000 (admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
# Prometheus: http://localhost:9090
# Exporter: http://localhost:8888/probe?target=typesense-1 (and -2, -3)
# Typesense: http://localhost:8108, :8109, :8110

# Typesense nodes peer by fixed IP (deploy/typesense/nodes), not hostname:
# Docker drops a stopped container's DNS name and may give a restarted one a
# new IP, either of which leaves a rejoining node unable to peer.
x-typesense: &typesense
  # TYPESENSE_VERSION=27.1 docker compose up -d tries an older release; CI runs both.
  image: typesense/typesense:${TYPESENSE_VERSION:-30.1}
  command:
    - --data-dir=/data
    - --api-key=${TYPESENSE_API_KEY:-local-dev-key}
    - --nodes=/etc/typesense/nodes
    - --enable-cors
  volumes:
    - ./deploy/typesense/nodes:/etc/typesense/nodes:ro
  healthcheck:
    # /health only reports ok once the node has joined a cluster with a leader.
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8108 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"ok\":true' <&3"]
    interval: 5s
    timeout: 3s
    retries: 30

services:
  typesense-1:
    <<: *typesense
    hostname: typesense-1
    networks: { default: { ipv4_address: 10.89.0.11 } }
    ports: ["8108:8108"]
    volumes: [./deploy/typesense/nodes:/etc/typesense/nodes:ro, typesense-1-data:/data]
  typesense-2:
    <<: *typesense
    hostname: typesense-2
    networks: { default: { ipv4_address: 10.89.0.12 } }
    ports: ["8109:8108"]
    volumes: [./deploy/typesense/nodes:/etc/typesense/nodes:ro, typesense-2-data:/data]
  typesense-3:
    <<: *typesense
    hostname: typesense-3
    networks: { default: { ipv4_address: 10.89.0.13 } }
    ports: ["8110:8108"]
    volumes: [./deploy/typesense/nodes:/etc/typesense/nodes:ro, typesense-3-data:/data]

  # One exporter for the whole cluster: Prometheus passes each node as
  # /probe?target=..., and only these nodes may be probed.
  exporter:
    build: .
    image: typesense-prometheus-exporter:local
    environment:
      TYPESENSE_PROBE_ALLOWED_TARGETS: typesense-1,typesense-2,typesense-3
      TYPESENSE_PORT: "8108"
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY:-local-dev-key}
      TYPESENSE_TIMEOUT: "2"
      # The default since 1.0.0, set explicitly so the dashboards and e2e tests
      # prove nothing depends on the 0.4 names.
      TYPESENSE_METRIC_NAMES: v1
    ports: ["8888:8888"]
    depends_on:
      typesense-1: { condition: service_healthy }
      typesense-2: { condition: service_healthy }
      typesense-3: { condition: service_healthy }

  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-lifecycle"]
    ports: ["9090:9090"]
    volumes:
      - ./deploy/prometheus:/etc/prometheus:ro
    depends_on: [exporter]

  # Grafana provisioning does not resolve the ${DS_PROMETHEUS} import input in
  # the shared dashboards, so copy them with the datasource uid filled in.
  grafana-dashboards:
    image: alpine:3.20
    command: ["sh", "-c", "for f in /src/*.json; do sed 's/$${DS_PROMETHEUS}/prometheus/g' \"$$f\" > \"/out/$$(basename \"$$f\")\"; done"]
    volumes:
      - ./grafana:/src:ro
      - grafana-dashboards:/out

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_DEFAULT_THEME: dark
    ports: ["3000:3000"]
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus: { condition: service_started }
      grafana-dashboards: { condition: service_completed_successfully }

networks:
  default:
    ipam:
      config:
        - subnet: 10.89.0.0/24

volumes:
  typesense-1-data:
  typesense-2-data:
  typesense-3-data:
  grafana-dashboards:
