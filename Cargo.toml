[package]
name = "typesense-prometheus-exporter"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = "0.7.3"
clap = { version = "4.4.16", features = ["derive", "cargo", "env"] }
prometheus = "0.13.3"
regex = "1.10.2"
reqwest = { version = "0.11.23", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0.195", features = ["derive"] }
serde_json = "1.0.111"
tokio = { version = "1.35.1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3.18"

[dev-dependencies]
wiremock = "0.6"

[features]
# End-to-end tests against the docker compose stack: `make e2e`.
e2e = []

[[test]]
name = "e2e"
path = "tests/e2e.rs"
required-features = ["e2e"]
